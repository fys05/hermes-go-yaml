name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          fmt_output=$(gofmt -l . 2>&1)
          if [ -n "$fmt_output" ]; then
            echo "Files not formatted:"
            echo "$fmt_output"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Deploy to K8s
        run: |
          NS="${{ vars.K8S_NAMESPACE || 'default' }}"
          DOMAIN="${{ vars.DOMAIN }}"
          TLS_SECRET="${{ vars.TLS_SECRET }}"
          DB_PASSWORD=*** secrets.DB_PASSWORD }}"

          # Ensure image-secret exists
          kubectl get secret image-secret -n "${NS}" --insecure-skip-tls-verify >/dev/null 2>&1 || \
            kubectl create secret docker-registry image-secret \
              --docker-server="${{ env.REGISTRY }}" \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GITHUB_TOKEN }}" \
              -n "${NS}" --insecure-skip-tls-verify

          # Substitute placeholders in all k8s YAML files
          for f in $(find k8s -name '*.yaml'); do
            sed -i "s|\${DOCKER_IMAGE}|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}|g" "$f"
            sed -i "s|\${DOCKER_TAG}|${{ github.sha }}|g" "$f"
            sed -i "s|\${K8S_NAMESPACE}|${NS}|g" "$f"
            sed -i "s|\${DOMAIN}|${DOMAIN}|g" "$f"
            sed -i "s|\${TLS_SECRET}|${TLS_SECRET}|g" "$f"
            sed -i "s|\${DB_PASSWORD}|${DB_PASSWORD}|g" "$f"
          done

          # Deploy database
          kubectl apply -f k8s/postgres/secret.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f k8s/postgres/pvc.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f k8s/postgres/deployment.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f k8s/postgres/service.yaml --insecure-skip-tls-verify --validate=false
          kubectl rollout status deployment/postgres -n "${NS}" --timeout=120s --insecure-skip-tls-verify

          # Deploy ingress (HTTP redirect + HTTPS)
          kubectl apply -f k8s/ingress-http.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f k8s/ingress-https.yaml --insecure-skip-tls-verify --validate=false

          # Deploy application
          kubectl apply -f k8s/app/deployment.yaml --insecure-skip-tls-verify --validate=false
          kubectl apply -f k8s/app/service.yaml --insecure-skip-tls-verify --validate=false
          kubectl rollout status deployment/yaml-validator -n "${NS}" --timeout=120s --insecure-skip-tls-verify
          kubectl get pods -l app=yaml-validator -n "${NS}" --insecure-skip-tls-verify
          kubectl get pods -l app=postgres -n "${NS}" --insecure-skip-tls-verify
